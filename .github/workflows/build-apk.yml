name: Build APK (from zip)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          test -f prayer_planner_src.zip || { echo "ملف prayer_planner_src.zip غير موجود في جذر المستودع"; exit 1; }
          unzip -o prayer_planner_src.zip -d src
          ls -R src

      - name: Check optional bundled adhan
        id: adhan
        run: |
          if [ -f src/sounds/adhan.mp3 ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Bundled adhan found"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "No bundled adhan (users can still upload one in the app)"
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project shell
        run: flutter create --platforms=android --project-name prayer_planner --org com.example app

      - name: Copy source into the project
        run: |
          rm -rf app/lib app/pubspec.yaml
          cp -r src/lib app/lib
          cp src/pubspec.yaml app/pubspec.yaml

      - name: Add bundled adhan to raw resources
        if: steps.adhan.outputs.has == 'true'
        run: |
          mkdir -p app/android/app/src/main/res/raw
          cp src/sounds/adhan.mp3 app/android/app/src/main/res/raw/adhan.mp3

      - name: Raise compileSdk to 36 (required by plugins)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          base = pathlib.Path('app/android/app')
          kts = base / 'build.gradle.kts'
          is_kts = kts.exists()
          f = kts if is_kts else base / 'build.gradle'
          text = f.read_text(encoding='utf-8')
          if is_kts:
              text = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', text)
          else:
              text = re.sub(r'compileSdk(\s+|\s*=\s*)[^\n]+', 'compileSdk 36', text)
          f.write_text(text, encoding='utf-8')
          print('compileSdk set to 36 in', f)
          EOF

      - name: Force all plugins to compileSdk 36
        run: |
          python3 - <<'EOF'
          import pathlib
          base = pathlib.Path('app/android')
          kts = base / 'build.gradle.kts'
          is_kts = kts.exists()
          f = kts if is_kts else base / 'build.gradle'
          text = f.read_text(encoding='utf-8')
          if is_kts:
              block = '''
          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByType(com.android.build.gradle.LibraryExtension::class.java)?.compileSdk = 36
                  }
              }
          }
          '''
          else:
              block = '''
          subprojects { p ->
              if (p.name != 'app') {
                  p.afterEvaluate {
                      if (p.hasProperty('android')) {
                          p.android.compileSdkVersion 36
                      }
                  }
              }
          }
          '''
          f.write_text(text + block, encoding='utf-8')
          print('Plugin compileSdk override added to', f)
          EOF

      - name: Add Android permissions
        run: |
          python3 - <<'EOF'
          import re, pathlib
          manifest = pathlib.Path('app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          perms = [
              'android.permission.INTERNET',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
              'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.READ_MEDIA_AUDIO',
          ]
          block = ''.join(f'\n    <uses-permission android:name="{p}"/>' for p in perms)
          block += '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
          text = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + block, text, count=1)
          manifest.write_text(text, encoding='utf-8')
          print('Permissions added')
          EOF

      - name: Enable core library desugaring (needed for notifications)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          base = pathlib.Path('app/android/app')
          kts = base / 'build.gradle.kts'
          is_kts = kts.exists()
          f = kts if is_kts else base / 'build.gradle'
          text = f.read_text(encoding='utf-8')

          flag = ('isCoreLibraryDesugaringEnabled = true' if is_kts
                  else 'coreLibraryDesugaringEnabled true')
          text = re.sub(r'(compileOptions\s*\{)',
                        lambda m: m.group(1) + '\n        ' + flag,
                        text, count=1)

          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                 if is_kts else
                 "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
          text += '\n\ndependencies {\n    ' + dep + '\n}\n'

          f.write_text(text, encoding='utf-8')
          print('Desugaring enabled in', f)
          EOF

      - name: Pre-install Android NDK (with retries)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK=28.2.13676358
          rm -rf "$HOME/.android/cache" "$ANDROID_HOME/ndk/$NDK"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          for i in 1 2 3; do
            if "$SDKMANAGER" "ndk;$NDK"; then
              echo "NDK installed"
              exit 0
            fi
            echo "NDK download failed, retry $i of 3"
            rm -rf "$HOME/.android/cache" "$ANDROID_HOME/ndk/$NDK"
            sleep 30
          done
          exit 1

      - name: Build release APK
        working-directory: app
        env:
          HAS_ADHAN: ${{ steps.adhan.outputs.has }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=HAS_ADHAN=$HAS_ADHAN

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-planner-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
